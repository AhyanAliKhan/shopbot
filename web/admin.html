<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bloom Seller Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
</head>
<body>
  <nav class="topbar">
    <a class="logo" href="./">Bazaar <span>Bloom</span></a>
    <span class="pill">Seller dashboard</span>
    <div class="spacer"></div>
    <a class="btn small" href="./" style="text-decoration:none">View store</a>
    <button class="btn small" id="logout" style="display:none">Lock</button>
  </nav>

  <section class="login panel" id="login">
    <h2 style="margin-top:0">Seller sign-in</h2>
    <p class="muted">Enter the admin key (the <code>ADMIN_API_KEY</code> set on the agent server).</p>
    <form id="loginForm" style="display:flex;gap:8px">
      <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" />
      <button class="btn primary">Open</button>
    </form>
    <p id="loginErr" class="muted" style="color:var(--bad)"></p>
  </section>

  <div class="admin-wrap" id="app" style="display:none">
    <aside class="side" id="side">
      <button data-tab="overview" class="active">📈 Overview</button>
      <button data-tab="orders">📦 Orders</button>
      <button data-tab="products">🏷️ Products</button>
      <button data-tab="conversations">💬 Conversations</button>
      <button data-tab="coupons">🎟️ Coupons</button>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
